name: Build App A

on:
  push:
    branches: ['**']  # to exclude tags
    paths:
      - 'appA/**'
      - '.github/workflows/build-app.yaml' 

jobs: 
  call-build-A:
    uses: ./.github/workflows/reusable-build.yaml
    permissions:
      id-token: write # Required for requesting the JWT/OIDC token
      contents: read 
    secrets: inherit
    with:
      app-path: "./appA"
      image-name: lori/service-a
      image-version: "1.0"
