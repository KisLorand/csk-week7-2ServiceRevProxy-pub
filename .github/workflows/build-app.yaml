name: Build App A

on:
  push:
    branches: ['**']  # to exclude tags
    paths:
      - 'appA/**'
      - '.github/workflows/build-app.yaml' 

env:
  IMAGE_NAME: lori/service-a
  IMAGE_VERSION: "1.0"

jobs: 
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for requesting the JWT/OIDC token
      contents: read 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_USER_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} |  
          docker login --username AWS --password-stdin ${{ secrets.ECR_URI }}

      - name: Build application
        working-directory: ./appA
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }} .

      - name: Create tag
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }} \
          ${{ secrets.ECR_URI }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}

      - name: Push to ECR
        run: |
          docker push ${{ secrets.ECR_URI }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
