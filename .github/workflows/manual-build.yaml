name: Build Apps manually

on:
  workflow_dispatch:
    inputs:
      image-version:
        description: 'The version for the created image'
        required: true
        type: string
      app-type:
        required: true
        type: choice
        options:
          - appA
          - appB
          - All

jobs: 
  build-appA:
    uses: ./.github/workflows/reusable-build.yaml
    if: ${{ inputs.app-type }} == "appA" || ${{ inputs.app-type }} == "All"
    permissions:
      id-token: write # Required for requesting the JWT/OIDC token
      contents: read 
    secrets: inherit
    with:
      app-path: "./appA"
      image-name: lori/service-a
      image-version: ${{ inputs.image-version }}

  build-appB:
    uses: ./.github/workflows/reusable-build.yaml
    if: ${{ inputs.app-type }} == "appB" || ${{ inputs.app-type }} == "All"
    permissions:
      id-token: write # Required for requesting the JWT/OIDC token
      contents: read 
    secrets: inherit
    with:
      app-path: "./appB"
      image-name: lori/service-b
      image-version: ${{ inputs.image-version }}