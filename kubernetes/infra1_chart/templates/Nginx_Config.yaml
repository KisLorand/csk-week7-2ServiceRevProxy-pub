apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: infra1
data:
  SERVICE_A_PATH: /api/sa
  SERVICE_B_PATH: /api/sb
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-template
  namespace: infra1
data:
  default.conf.template: |
    server {
        listen 80;

        location ${SERVICE_A_PATH}/ {
            proxy_pass http://service-a:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ${SERVICE_B_PATH}/ {
            proxy_pass http://service-b:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
---