apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-daemonset
  namespace: infra1
  labels:
    app: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
          hostPort: 8080
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        env:
          - name: SERVICE_A_PATH
            valueFrom:
              configMapKeyRef:
                name: nginx-config
                key: SERVICE_A_PATH
          - name: SERVICE_B_PATH
            valueFrom:
              configMapKeyRef:
                name: nginx-config
                key: SERVICE_B_PATH
        volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates
      volumes:
        - name: nginx-template
          configMap:
            name: nginx-template